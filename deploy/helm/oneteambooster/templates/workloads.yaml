{{- range $component := list "frontend" "backend" }}
{{- $settings := index $.Values $component }}
{{- $port := ternary 8080 3000 (eq $component "frontend") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otb.fullname" $ }}-{{ $component }}
  labels:
    {{- include "otb.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $settings.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Chart.Name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Chart.Name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
      {{- if eq $component "frontend" }}
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ ternary 101 1000 (eq $component "frontend") }}
        runAsGroup: {{ ternary 101 1000 (eq $component "frontend") }}
        fsGroup: {{ ternary 101 1000 (eq $component "frontend") }}
        seccompProfile:
          type: RuntimeDefault
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "otb.image" $settings.image | quote }}
          imagePullPolicy: {{ $settings.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ $port }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- if eq $component "backend" }}
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: CAMPAIGN_ID, value: {{ $.Values.backend.campaignId | quote }} }
            - { name: PREVIEW_EMPLOYEE_SEARCH, value: {{ $.Values.backend.previewEmployeeSearch | quote }} }
            - { name: TEST_USER_MODE, value: {{ $.Values.backend.testUserMode | quote }} }
            - { name: PREVIEW_ORIGIN, value: {{ $.Values.backend.previewOrigin | quote }} }
            - { name: DATA_API_URL, value: {{ $.Values.backend.dataApiUrl | quote }} }
            {{- if $.Values.database.enabled }}
            - { name: PGHOST, value: {{ printf "%s-database" (include "otb.fullname" $) | quote }} }
            - { name: PGPORT, value: "5432" }
            - { name: PGDATABASE, value: oneteambooster }
            - { name: PGUSER, value: otb }
            {{- end }}
          {{- with $settings.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ ternary "/healthz" "/readyz" (eq $component "frontend") }}
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if eq $component "frontend" }}
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if eq $component "frontend" }}
        - name: nginx-config
          configMap:
            name: {{ include "otb.fullname" $ }}-nginx
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "otb.fullname" $ }}-{{ $component }}
  labels:
    {{- include "otb.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: {{ ternary $.Values.frontend.service.type "ClusterIP" (eq $component "frontend") }}
  selector:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
      {{- if and (eq $component "frontend") (eq $.Values.frontend.service.type "NodePort") $.Values.frontend.service.nodePort }}
      nodePort: {{ $.Values.frontend.service.nodePort }}
      {{- end }}
{{- end }}
