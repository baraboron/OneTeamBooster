# Internal rollout: SSO login enabled; authenticated business records use PostgreSQL public schema.
frontend:
  image:
    repository: wonix-ops.ips.co.kr/library/oneteambooster-frontend
    tag: sso-20261012
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    nodePort: 30081
backend:
  image:
    repository: wonix-ops.ips.co.kr/library/oneteambooster-backend
    tag: sso-20261012
    pullPolicy: IfNotPresent
  existingSecret: otb-runtime
  testUserMode: false
  testAdminNames: ""
  previewOrigin: "https://oneteam.ips.co.kr"
  ssoInternalUrl: "http://oneteam-sso.platform-auth.svc.cluster.local:9999"
  openaiGatewayUrl: "https://uadmxxpoxaukuwwvfdpr.supabase.co/functions/v1/openai-gateway"
database:
  enabled: true
  image: docker.io/library/postgres:17-alpine
  imagePullPolicy: Never
  existingSecret: otb-runtime
nodeSelector:
  kubernetes.io/hostname: web-j3-w01
ingress:
  enabled: true
  host: oneteam.ips.co.kr
  tlsSecretName: oneteambooster-tls
